name: LSCT CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python Version
        run: python --version

      - name: Verify Lambda Source Exists
        run: |
          test -f lambda/lsct-employee-login.py
          echo "Lambda source file found."

      - name: Check Python Syntax
        run: |
          python -m py_compile lambda/lsct-employee-login.py
          echo "Syntax check passed."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Placeholder Test
        run: |
          echo "Phase 3 will replace this with an API Health Check."
          echo "Test Passed."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Placeholder Deploy
        run: |
          echo "Phase 4 will deploy lsct-employee-login to AWS Lambda."

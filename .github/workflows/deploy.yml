name: LSCT CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python Version
        run: python --version

      - name: Verify Lambda Source Exists
        run: |
          test -f lambda/lsct-employee-login.py
          echo "Lambda source file found."

      - name: Check Python Syntax
        run: |
          python -m py_compile lambda/lsct-employee-login.py
          echo "Syntax check passed."

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: API Health Check
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" \
          -X POST \
          https://1jwu7qfyrb.execute-api.ap-south-1.amazonaws.com/prod/employee/login \
          -H "Content-Type: application/json" \
          -d '{"employee_id":"E001"}')
  
          echo "HTTP Status: $STATUS"
          cat response.json
  
          if [ "$STATUS" -ne 200 ]; then
            echo "API Health Check Failed!"
            exit 1
          fi
  
          echo "API Health Check Passed!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Placeholder Deploy
        run: |
          echo "Phase 4 will deploy lsct-employee-login to AWS Lambda."

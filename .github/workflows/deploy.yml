name: LSCT CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python Version
        run: python --version

      - name: Verify Lambda Source Exists
        run: |
          test -f lambda/lsct-employee-login.py
          echo "Lambda source file found."

      - name: Check Python Syntax
        run: |
          python -m py_compile lambda/lsct-employee-login.py
          echo "Syntax check passed."

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: API Health Check
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" \
          -X POST \
          https://1jwu7qfyrb.execute-api.ap-south-1.amazonaws.com/prod/employee/login \
          -H "Content-Type: application/json" \
          -d '{"employee_id":"E001"}')

          echo "HTTP Status: $STATUS"
          cat response.json

          if [ "$STATUS" -ne 200 ]; then
            echo "API Health Check Failed!"
            exit 1
          fi

          echo "API Health Check Passed!"

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS CLI
        run: aws --version

      - name: Create Deployment Package
        run: |
          cp lambda/lsct-employee-login.py lambda/lambda_function.py
          cd lambda
          zip -r ../lambda.zip lambda_function.py

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name lsct-employee-login \
            --zip-file fileb://lambda.zip

      - name: Deployment Complete
        run: echo "✅ Lambda deployed successfully!"
